name: 🔄 Sync LeetCode Solutions

on:
  schedule:
    - cron: "0 */6 * * *"   # Runs every 6 hours automatically
  workflow_dispatch:          # Also allows manual trigger from Actions tab

jobs:
  sync:
    name: Sync LeetCode → GitHub
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Sync all LeetCode accepted submissions
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: solutions
          verbose: true
          commit-header: "⚡ [LeetCode Sync]"
          filter-duplicate-secs: 30
