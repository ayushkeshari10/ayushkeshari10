<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <radialGradient id="cg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a2e4a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ig">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes pulse {
        0%,100% { opacity:.6; }
        50%      { opacity:1;  }
      }
      .ring { animation: pulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="420" height="420" fill="url(#bg)" rx="14"/>

  <!-- Starfield -->
  <circle cx="15"  cy="45"  r=".9" fill="white" opacity=".55"/>
  <circle cx="50"  cy="180" r="1.2" fill="white" opacity=".4"/>
  <circle cx="400" cy="30"  r=".7" fill="white" opacity=".6"/>
  <circle cx="355" cy="150" r="1"   fill="white" opacity=".35"/>
  <circle cx="78"  cy="330" r=".9" fill="white" opacity=".5"/>
  <circle cx="185" cy="22"  r="1.3" fill="white" opacity=".4"/>
  <circle cx="335" cy="390" r=".7" fill="white" opacity=".5"/>
  <circle cx="28"  cy="285" r="1.1" fill="white" opacity=".3"/>
  <circle cx="375" cy="285" r=".8" fill="white" opacity=".6"/>
  <circle cx="125" cy="385" r="1"   fill="white" opacity=".4"/>
  <circle cx="408" cy="92"  r=".6" fill="white" opacity=".5"/>
  <circle cx="10"  cy="125" r=".9" fill="white" opacity=".3"/>
  <circle cx="270" cy="12"  r="1.2" fill="white" opacity=".5"/>
  <circle cx="148" cy="408" r=".8" fill="white" opacity=".4"/>
  <circle cx="62"  cy="62"  r="1"   fill="white" opacity=".5"/>
  <circle cx="318" cy="52"  r=".7" fill="white" opacity=".4"/>
  <circle cx="198" cy="415" r="1.1" fill="white" opacity=".3"/>
  <circle cx="395" cy="352" r=".8" fill="white" opacity=".5"/>
  <circle cx="32"  cy="358" r=".6" fill="white" opacity=".4"/>
  <circle cx="104" cy="144" r=".5" fill="white" opacity=".6"/>
  <circle cx="295" cy="348" r="1.3" fill="white" opacity=".3"/>
  <circle cx="358" cy="122" r=".8" fill="white" opacity=".5"/>
  <circle cx="72"  cy="248" r=".9" fill="white" opacity=".4"/>
  <circle cx="248" cy="408" r=".7" fill="white" opacity=".5"/>
  <circle cx="415" cy="165" r=".6" fill="white" opacity=".4"/>
  <circle cx="165" cy="8"   r="1"   fill="white" opacity=".5"/>
  <circle cx="338" cy="235" r=".5" fill="white" opacity=".6"/>
  <circle cx="8"   cy="205" r=".8" fill="white" opacity=".3"/>
  <circle cx="208" cy="5"   r="1.2" fill="white" opacity=".4"/>
  <circle cx="378" cy="418" r=".7" fill="white" opacity=".5"/>
  <circle cx="128" cy="55"  r=".6" fill="white" opacity=".45"/>
  <circle cx="298" cy="178" r=".5" fill="white" opacity=".35"/>
  <circle cx="42"  cy="398" r=".9" fill="white" opacity=".5"/>
  <circle cx="388" cy="215" r=".7" fill="white" opacity=".4"/>

  <!-- ── Orbit ring guides ── -->
  <circle cx="210" cy="210" r="140" fill="none" stroke="#0550ae" stroke-opacity=".1" stroke-width="1" stroke-dasharray="5,5" class="ring"/>
  <circle cx="210" cy="210" r="88"  fill="none" stroke="#0550ae" stroke-opacity=".18" stroke-width="1" stroke-dasharray="3,4" class="ring"/>

  <!-- ── Center badge ── -->
  <circle cx="210" cy="210" r="48" fill="url(#cg)" stroke="#0550ae" stroke-width="1.8" filter="url(#glow)"/>
  <text x="210" y="204" text-anchor="middle" fill="#0550ae" font-family="Courier New,monospace" font-size="15" font-weight="bold" filter="url(#glow)">A K</text>
  <text x="210" y="220" text-anchor="middle" fill="#0550ae" font-family="Courier New,monospace" font-size="8" opacity=".65">ayushkeshari10</text>

  <!-- ════════ INNER RING — clockwise 13s ════════ -->
  <!-- r=88, initial icon x=298-13=285, y=210-13=197, 26×26 rect -->

  <!-- JS  0° -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 210 210" to="360 210 210" dur="13s" repeatCount="indefinite"/>
    <rect x="285" y="197" width="26" height="26" rx="5" fill="#F7DF1E" filter="url(#ig)"/>
    <text x="298" y="214" text-anchor="middle" fill="#000" font-family="Courier New,monospace" font-size="9" font-weight="bold">JS</text>
  </g>

  <!-- TS  60° -->
  <g><animateTransform attributeName="transform" type="rotate" from="60 210 210" to="420 210 210" dur="13s" repeatCount="indefinite"/>
    <rect x="285" y="197" width="26" height="26" rx="5" fill="#3178C6" filter="url(#ig)"/>
    <text x="298" y="214" text-anchor="middle" fill="#fff" font-family="Courier New,monospace" font-size="9" font-weight="bold">TS</text>
  </g>

  <!-- PY  120° -->
  <g><animateTransform attributeName="transform" type="rotate" from="120 210 210" to="480 210 210" dur="13s" repeatCount="indefinite"/>
    <rect x="285" y="197" width="26" height="26" rx="5" fill="#3776AB" filter="url(#ig)"/>
    <text x="298" y="214" text-anchor="middle" fill="#fff" font-family="Courier New,monospace" font-size="9" font-weight="bold">PY</text>
  </g>

  <!-- C++ 180° -->
  <g><animateTransform attributeName="transform" type="rotate" from="180 210 210" to="540 210 210" dur="13s" repeatCount="indefinite"/>
    <rect x="285" y="197" width="26" height="26" rx="5" fill="#00599C" filter="url(#ig)"/>
    <text x="298" y="214" text-anchor="middle" fill="#fff" font-family="Courier New,monospace" font-size="8" font-weight="bold">C++</text>
  </g>

  <!-- SQL 240° -->
  <g><animateTransform attributeName="transform" type="rotate" from="240 210 210" to="600 210 210" dur="13s" repeatCount="indefinite"/>
    <rect x="285" y="197" width="26" height="26" rx="5" fill="#336791" filter="url(#ig)"/>
    <text x="298" y="214" text-anchor="middle" fill="#fff" font-family="Courier New,monospace" font-size="8" font-weight="bold">SQL</text>
  </g>

  <!-- GIT 300° -->
  <g><animateTransform attributeName="transform" type="rotate" from="300 210 210" to="660 210 210" dur="13s" repeatCount="indefinite"/>
    <rect x="285" y="197" width="26" height="26" rx="5" fill="#F05032" filter="url(#ig)"/>
    <text x="298" y="214" text-anchor="middle" fill="#fff" font-family="Courier New,monospace" font-size="8" font-weight="bold">GIT</text>
  </g>

  <!-- ════════ OUTER RING — counter-clockwise 22s ════════ -->
  <!-- r=140, initial icon x=350-13=337, y=210-13=197 -->

  <!-- React   0° -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 210 210" to="-360 210 210" dur="22s" repeatCount="indefinite"/>
    <rect x="337" y="197" width="26" height="26" rx="5" fill="#61DAFB" filter="url(#ig)"/>
    <text x="350" y="214" text-anchor="middle" fill="#000" font-family="Courier New,monospace" font-size="9" font-weight="bold">Re</text>
  </g>

  <!-- Node   45° -->
  <g><animateTransform attributeName="transform" type="rotate" from="45 210 210" to="-315 210 210" dur="22s" repeatCount="indefinite"/>
    <rect x="337" y="197" width="26" height="26" rx="5" fill="#339933" filter="url(#ig)"/>
    <text x="350" y="214" text-anchor="middle" fill="#fff" font-family="Courier New,monospace" font-size="9" font-weight="bold">Nd</text>
  </g>

  <!-- Next.js  90° -->
  <g><animateTransform attributeName="transform" type="rotate" from="90 210 210" to="-270 210 210" dur="22s" repeatCount="indefinite"/>
    <rect x="337" y="197" width="26" height="26" rx="5" fill="#1a1a2e" stroke="#ffffff" stroke-width=".7" filter="url(#ig)"/>
    <text x="350" y="214" text-anchor="middle" fill="#fff" font-family="Courier New,monospace" font-size="9" font-weight="bold">Nx</text>
  </g>

  <!-- HTML5  135° -->
  <g><animateTransform attributeName="transform" type="rotate" from="135 210 210" to="-225 210 210" dur="22s" repeatCount="indefinite"/>
    <rect x="337" y="197" width="26" height="26" rx="5" fill="#E34F26" filter="url(#ig)"/>
    <text x="350" y="214" text-anchor="middle" fill="#fff" font-family="Courier New,monospace" font-size="9" font-weight="bold">H5</text>
  </g>

  <!-- CSS3   180° -->
  <g><animateTransform attributeName="transform" type="rotate" from="180 210 210" to="-180 210 210" dur="22s" repeatCount="indefinite"/>
    <rect x="337" y="197" width="26" height="26" rx="5" fill="#1572B6" filter="url(#ig)"/>
    <text x="350" y="214" text-anchor="middle" fill="#fff" font-family="Courier New,monospace" font-size="9" font-weight="bold">CS</text>
  </g>

  <!-- Supabase 225° -->
  <g><animateTransform attributeName="transform" type="rotate" from="225 210 210" to="-135 210 210" dur="22s" repeatCount="indefinite"/>
    <rect x="337" y="197" width="26" height="26" rx="5" fill="#3ECF8E" filter="url(#ig)"/>
    <text x="350" y="214" text-anchor="middle" fill="#000" font-family="Courier New,monospace" font-size="9" font-weight="bold">SB</text>
  </g>

  <!-- Vercel  270° -->
  <g><animateTransform attributeName="transform" type="rotate" from="270 210 210" to="-90 210 210" dur="22s" repeatCount="indefinite"/>
    <rect x="337" y="197" width="26" height="26" rx="5" fill="#24292f" filter="url(#ig)"/>
    <text x="350" y="214" text-anchor="middle" fill="#000" font-family="Courier New,monospace" font-size="9" font-weight="bold">Vr</text>
  </g>

  <!-- GH Actions 315° -->
  <g><animateTransform attributeName="transform" type="rotate" from="315 210 210" to="-45 210 210" dur="22s" repeatCount="indefinite"/>
    <rect x="337" y="197" width="26" height="26" rx="5" fill="#2088FF" filter="url(#ig)"/>
    <text x="350" y="214" text-anchor="middle" fill="#fff" font-family="Courier New,monospace" font-size="9" font-weight="bold">GA</text>
  </g>

</svg>

